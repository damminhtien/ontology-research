name: ci

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Makefile"
      - "VERSION"
      - "CHANGELOG-DATA.md"
      - "pyproject.toml"
      - "requirements.txt"
      - "benchmarks/**"
      - "foundry/**"
      - "ontology/**"
      - "registry/**"
      - "requirements/**"
      - "shapes/**"
      - "tests/**"
      - "tools/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies (developer path)
        run: make setup

      - name: Dependency consistency
        run: .venv/bin/pip check

      - name: Run fast correctness checks
        run: make ci-check
