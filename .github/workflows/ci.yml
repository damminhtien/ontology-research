name: ci

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!mkdocs.yml"
      - "!requirements-docs.txt"
      - "!**.md"
      - "requirements/competency_questions.md"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies (developer path)
        run: make setup

      - name: Dependency consistency
        run: .venv/bin/pip check

      - name: Full check (quality, lint, versions, SHACL, DAG, tests, SLO gate)
        run: make check

      - name: Upload ontology quality report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ontology-quality
          path: build/ontology-quality.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Benchmark (default scale)
        run: .venv/bin/python tools/benchmark.py --out build

      - name: Render benchmark summary
        run: |
          {
            echo "## Benchmark report"
            echo ""
            echo '```json'
            cat build/benchmark-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: build/benchmark-report.json
          retention-days: 90
